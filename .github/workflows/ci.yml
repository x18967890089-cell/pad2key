name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: parse + ascii + PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax tree must have zero parse errors (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\pad2key.ps1", [ref]$null, [ref]$errs)
          if ($errs -and $errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "PARSE ERROR: $($_.Message) at line $($_.Extent.StartLineNumber)" }
            exit 1
          }
          Write-Host "parse ok: 0 errors"

      - name: Script must stay pure ASCII
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\pad2key.ps1")
          $bad = ($bytes | Where-Object { $_ -gt 127 }).Count
          if ($bad -gt 0) {
            Write-Host "non-ascii bytes: $bad"
            Write-Host "A no-BOM script is read as ANSI by Windows PowerShell 5.1 when double-clicked or run by a scheduler."
            exit 1
          }
          Write-Host "ascii ok: 0 non-ascii bytes"

      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber
          $issues = Invoke-ScriptAnalyzer -Path "$PWD\pad2key.ps1" -Severity Error
          if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }
          Write-Host "PSScriptAnalyzer: no errors"

  selftest:
    name: -SelfTest with a real SDL2.dll
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Without SDL2.dll the script must exit 3
        shell: powershell
        run: |
          $dll = Join-Path $PWD 'SDL2.dll'
          if (Test-Path $dll) { Write-Host 'SDL2.dll should not be committed (see .gitignore)'; exit 1 }
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\pad2key.ps1 -SelfTest 2>&1
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 3) { Write-Host "expected exit 3 when SDL2.dll is absent, got $rc"; exit 1 }
          Write-Host 'missing-dll exit code ok'
          exit 0

      - name: Install SDL2 the way the README tells users to
        shell: powershell
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'sdl2.zip'
          $urls = @(
            'https://libsdl.org/release/SDL2-2.32.10-win32-x64.zip',
            'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip'
          )
          $got = $false
          foreach ($u in $urls) {
            Write-Host "trying $u"
            & curl.exe -fsSL --max-time 120 -o $zip $u
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -gt 100000) { $got = $true; break }
            Write-Host "  failed ($LASTEXITCODE)"
          }
          if (-not $got) { Write-Host 'could not download SDL2 in 120s'; exit 1 }
          Write-Host ("downloaded {0} bytes" -f (Get-Item $zip).Length)
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'sdl2') -Force
          $all = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'sdl2') -Recurse -Filter SDL2.dll
          $all | ForEach-Object { Write-Host ("found {0} ({1} bytes)" -f $_.FullName, $_.Length) }
          # prefer the 64-bit build when the archive ships both; the self-test prints which one loaded
          $dll = $all | Where-Object { $_.FullName -match 'x64' -or $_.FullName -match 'x86_64' } | Select-Object -First 1
          if (-not $dll) { $dll = $all | Select-Object -First 1 }
          if (-not $dll) { Write-Host 'no SDL2.dll inside the archive'; exit 1 }
          Copy-Item $dll.FullName (Join-Path $PWD 'SDL2.dll') -Force
          Write-Host ("SDL2.dll: {0} bytes" -f (Get-Item (Join-Path $PWD 'SDL2.dll')).Length)
          exit 0

      - name: Run the self-test (no controller attached on a runner)
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\pad2key.ps1 -SelfTest 2>&1
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 0) { Write-Host "self-test exited $rc"; exit 1 }
          $text = ($out | Out-String)
          foreach ($needle in @('pad2key self-test', 'SDL2 build', 'joysticks', 'self-test finished, no keys were injected')) {
            if ($text -notmatch [regex]::Escape($needle)) { Write-Host "missing output: $needle"; exit 1 }
          }
          Write-Host 'self-test ok'
          exit 0

      - name: No target game must exit 2
        shell: powershell
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File .\pad2key.ps1 2>&1
          $rc = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($rc -ne 2) { Write-Host "expected exit 2, got $rc"; exit 1 }
          Write-Host 'usage exit code ok'
          exit 0
